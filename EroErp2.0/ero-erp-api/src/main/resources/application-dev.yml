spring:
  application:
    name: ero-erp

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      leak-detection-threshold: 60000
      # Regra 5: sem o Detail do Postgres na mensagem da exceção — ele traz o
      # valor que colidiu (Key (email)=(...) already exists), e o Hibernate
      # loga a mensagem do driver. O nome da constraint segue disponível.
      data-source-properties:
        logServerErrorDetail: false

  jpa:
    hibernate:
      ddl-auto: none          # o schema é do Liquibase
    open-in-view: false       # sem lazy loading fora da transação
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
          time_zone: UTC
        order_inserts: true
        order_updates: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.xml

  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  error:
    include-stacktrace: never
    include-message: never
  compression:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  access-ttl: PT8H
  refresh-ttl: P7D

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  superadmin:
    tenant-nome: ${SUPERADMIN_TENANT_NOME:EroErp Admin}
    nome: ${SUPERADMIN_NAME}
    email: ${SUPERADMIN_EMAIL}
    senha: ${SUPERADMIN_PASSWORD}
  seguranca:
    max-tentativas-login: 5
    duracao-bloqueio: PT15M
    rate-limit-por-minuto: 5
    # O webhook do WhatsApp: a Evolution chama de um IP só, com rajadas.
    rate-limit-webhook-por-minuto: 120
  auditoria:
    retencao-meses: 12
  acesso:
    # Fuso em que o período de acesso vence — sempre no fim do dia local.
    fuso-horario: America/Sao_Paulo
  cripto:
    # 32 bytes em base64 (openssl rand -base64 32). Sem ela a API não sobe.
    # Trocar a chave torna ilegíveis as apikeys já gravadas. Ver CriptoConverter.
    chave: ${APP_CRIPTO_CHAVE:}
  # URL pública desta API, para a Evolution chamar o webhook do WhatsApp.
  # Vazia, o webhook não é configurado e o status vem só pela tela (docs/13).
  public-url: ${APP_PUBLIC_URL:}

logging:
  level:
    root: INFO
    com.api.ero_erp: DEBUG
    org.springframework.web: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
