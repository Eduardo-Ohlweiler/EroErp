<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>EroErp</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="robots" content="noindex" />

    <meta name="theme-color" content="#FAF6FE" />

    <!--
      Aplica o tema antes do React montar, evitando o flash de cor errada.
      O padrão é CLARO — é o tema da marca. Não seguimos `prefers-color-scheme`:
      quem prefere o escuro alterna no header, e a escolha fica salva.

      A paleta (docs/05 §11) vem do cache da última consulta ao servidor; o
      ThemeContext confere com o servidor logo depois. PADRAO não tem atributo.
    -->
    <script>
      (function () {
        var salvo = localStorage.getItem('ero-tema')
        var tema = salvo === 'dark' ? 'dark' : 'light'
        document.documentElement.dataset.theme = tema
        // A variante _MENU_ESCURO usa as cores da base; a moldura é do React.
        var paleta = /^([A-Z]+)(_MENU_ESCURO)?$/.exec(localStorage.getItem('ero-paleta') || '')
        if (paleta && paleta[1] !== 'PADRAO') {
          document.documentElement.dataset.paleta = paleta[1].toLowerCase()
        }
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', tema === 'dark' ? '#00091A' : '#FAF6FE')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
