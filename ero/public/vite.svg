<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="eBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7fd3ff"/>
      <stop offset="35%" stop-color="#2e9bff"/>
      <stop offset="100%" stop-color="#0b4fa8"/>
    </linearGradient>

    <linearGradient id="orbitBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8de8ff"/>
      <stop offset="50%" stop-color="#38a3ff"/>
      <stop offset="100%" stop-color="#0b4fa8"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Órbita atrás -->
  <ellipse
    cx="128"
    cy="138"
    rx="95"
    ry="40"
    transform="rotate(-18 128 138)"
    fill="none"
    stroke="url(#orbitBlue)"
    stroke-width="12"
    opacity="0.55"
  />

  <!-- E -->
  <g filter="url(#shadow)">
    <path
      fill="url(#eBlue)"
      d="
        M70 45
        H190
        V70
        H100
        V115
        H175
        V140
        H100
        V185
        H190
        V210
        H70
        Z
      "
    />

    <!-- brilho metálico -->
    <path
      fill="rgba(255,255,255,.35)"
      d="
        M78 52
        H180
        V62
        H90
        Z
      "
    />
  </g>

  <!-- Órbita na frente -->
  <path
    d="M42 154 C70 182, 112 194, 166 187 C194 183, 214 173, 224 160"
    fill="none"
    stroke="url(#orbitBlue)"
    stroke-width="12"
    stroke-linecap="round"
  />

  <!-- ponto luminoso -->
  <circle
    cx="220"
    cy="158"
    r="8"
    fill="#8de8ff"
  />
</svg>