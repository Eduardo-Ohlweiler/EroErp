# Produção: tudo vem de variável de ambiente (ver .env.example).

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USUARIO}
    password: ${DB_SENHA}
    hikari:
      maximum-pool-size: ${DB_POOL:20}

server:
  # Atrás de proxy reverso (nginx/traefik): confia no X-Forwarded-* SÓ do proxy.
  forward-headers-strategy: ${APP_PROXY_HEADERS:native}

logging:
  structured:
    format:
      console: ecs
