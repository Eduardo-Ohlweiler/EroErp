# Configuração BASE = segura por padrão (vale para produção).
# O perfil "dev" afrouxa só o necessário para desenvolver; nunca o contrário.
# Perfil ativo vem do ambiente: SPRING_PROFILES_ACTIVE=dev|prod (não fixe aqui).

spring:
  application:
    name: ero-api
  docker:
    compose:
      enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  liquibase:
    change-log: classpath:db/changelog/changelog-master.xml
  servlet:
    multipart:
      # Sem upload por enquanto: multipart desligado para não aceitar corpo grande
      # antes do LimiteTamanhoFilter. Rota de upload terá configuração própria.
      enabled: false
  data:
    web:
      pageable:
        max-page-size: 100
  jackson:
    default-property-inclusion: always
    # Enum só pelo nome: "papel": 2 ou "tema": 1 dão 400 em vez de pegar a constante pela posição.
    datatype:
      enum:
        fail-on-numbers-for-enums: true
  threads:
    virtual:
      enabled: true
  # E-mail (código do login). Padrão: Gmail com senha de app, STARTTLS obrigatório.
  # Para outro servidor (ex.: Mailpit local sem TLS) troque pelas variáveis MAIL_* (ver .env.example).
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORTA:587}
    username: ${MAIL_USUARIO:}
    password: ${MAIL_SENHA_APP:}
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${MAIL_STARTTLS:true}
      "[mail.smtp.starttls.required]": ${MAIL_STARTTLS:true}
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000
      # Message-ID com o domínio do remetente, e não com o IP interno da máquina.
      "[mail.from]": ${app.email.remetente:}

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
  servlet:
    session:
      tracking-modes: []
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 2MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    # O health não testa o SMTP: e-mail fora do ar não pode derrubar a API inteira.
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  seguranca:
    jwt-segredo: ${APP_JWT_SEGREDO:}
    cripto-chave: ${APP_CRIPTO_CHAVE:}
    cors-origens: ${APP_CORS_ORIGENS:}
    cookie-seguro: true
    # Códigos de login NOVOS por usuário por hora (reenvios não contam). Passou: 429 com Retry-After.
    codigo-max-emissoes-por-hora: ${APP_CODIGO_MAX_EMISSOES_POR_HORA:10}
  email:
    # Endereço do "De:". No Gmail precisa ser a própria conta (MAIL_USUARIO).
    remetente: ${MAIL_REMETENTE:${MAIL_USUARIO:}}
    remetente-nome: ${MAIL_REMETENTE_NOME:CRM Glass}
  superadmin:
    email: ${SUPERADMIN_EMAIL:}
    senha: ${SUPERADMIN_SENHA:}
    nome: ${SUPERADMIN_NOME:Superadmin}
  # Consulta de CEP (ViaCEP), feita pelo back. Host fixo; o deploy precisa liberar a saída para ele.
  # Limite próprio por IP: app.rate-limit.cep (padrão 30/min).
  cep:
    url: https://viacep.com.br/ws

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
