<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seu código de acesso</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f7;font-family:Arial,Helvetica,sans-serif;color:#1f2330;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f4f7;padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;background:#ffffff;border-radius:12px;padding:32px;">
          <tr>
            <td style="font-size:14px;color:#6b6f80;padding-bottom:8px;">{{sistema}}</td>
          </tr>
          <tr>
            <td style="font-size:20px;font-weight:bold;padding-bottom:16px;">Olá, {{nome}}!</td>
          </tr>
          <tr>
            <td style="font-size:15px;line-height:22px;padding-bottom:20px;">Use este código para terminar de entrar:</td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom:20px;">
              <div style="display:inline-block;font-size:32px;letter-spacing:8px;font-weight:bold;font-family:'Courier New',monospace;background:#f0eefc;color:#2d2470;border-radius:8px;padding:12px 20px;">{{codigo}}</div>
            </td>
          </tr>
          <tr>
            <td style="font-size:15px;line-height:22px;padding-bottom:20px;">Ele vale <strong>{{minutos}} minutos</strong> e só pode ser usado uma vez. Ninguém da equipe vai pedir este código.</td>
          </tr>
          <tr>
            <td style="font-size:13px;line-height:20px;color:#6b6f80;border-top:1px solid #e6e6ee;padding-top:16px;">Se não foi você que tentou entrar, troque sua senha assim que possível: quem tentou sabe a sua senha atual.</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
