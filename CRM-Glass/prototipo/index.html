<!doctype html>
<html lang="pt-BR" data-theme="dark" data-accent="violeta">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vitrum CRM — Protótipo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica tema e destaque salvos antes da primeira pintura (evita piscar).
      try {
        var s = JSON.parse(localStorage.getItem('vitrum:settings') || '{}');
        if (s.theme) document.documentElement.dataset.theme = s.theme;
        if (s.accent) document.documentElement.dataset.accent = s.accent;
        if (s.blur) document.documentElement.style.setProperty('--blur', s.blur + 'px');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
