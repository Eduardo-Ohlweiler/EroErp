# Cabeçalhos de segurança do front. Incluir em TODO location que tenha add_header próprio
# (add_header dentro de um location anula os do nível acima).
# 'unsafe-inline' em style-src: a folha impressa injeta um <style>. Fonte local (@fontsource); o Vite embute fontes pequenas como data: no CSS, por isso data: em font-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
