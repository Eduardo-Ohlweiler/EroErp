server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve o nome "api" de novo a cada poucos segundos (a api pode ser recriada com outro IP).
    resolver 127.0.0.11 valid=5s;
    set $api http://api:8080;

    # /api vai para a API na mesma origem (o cookie ero_refresh tem Path=/api/auth).
    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Swagger e health da API, só em dev.
    location ~ ^/(swagger-ui|v3/api-docs|actuator/health) {
        proxy_pass $api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
